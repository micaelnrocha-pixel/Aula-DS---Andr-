
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início | Meu Espaço</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body data-page="home" class="home-page">

    <header class="home-header">
        <div class="logo">✦ meu<span>espaço</span></div>
        <button id="logoutBtn" class="outline-btn">Sair da conta ↗</button>
    </header>

    <main class="home-main">

        <div class="success-mark">✓</div>

        <div class="eyebrow dark-eyebrow">
            LOGIN REALIZADO COM SUCESSO
        </div>

        <h1>Bem-vindo(a),<br><em id="welcomeName">visitante</em>!</h1>

        <p>Você criou sua conta e entrou no sistema. Tá funcionando direitinho! 🚀</p>

        <div class="welcome-card">
            <span class="status-dot"></span>
            <div>
                <strong>Tudo certo por aqui!</strong>
                <small>Seu primeiro sistema de login está rodando.</small>
            </div>
        </div>

        <button id="logoutMainBtn" class="primary-btn home-logout">
            Sair e voltar ao login <span>→</span>
        </button>

    </main>

    <footer class="home-footer">
        Feito com HTML, CSS e JavaScript ✦
    </footer>

</body>
</html>
